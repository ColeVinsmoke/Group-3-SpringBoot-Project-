<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
    <div class="logo">
      <i class="fas fa-graduation-cap"></i>
      ADMIN
    </div>

    <div class="nav-item" onclick="switchSection('dashboard', this)">
      <i class="fas fa-chart-pie"></i> <a href="adminDashboard.html">Dashboard</a>
    </div>

    <div class="nav-item active" onclick="switchSection('courses', this)">
      <i class="fas fa-book"></i><a href="courses.html"> Courses</a>
    </div>

  </div>
  <!-- MAIN -->
  <div class="main-content">

    <!-- HEADER -->
    <div class="header">
      <h2 id="pageTitle"></h2>

      <div class="user-profile">
        <div class="user-avatar"><i class="fas fa-user"></i></div>
        <span>Admin</span>
      </div>
    </div>

    <!-- COURSES -->
    <div id="courses" class="section active">

        <div class="table-header">
            <h2>Available Courses</h2>
            <button class="btn btn-primary" id="openPopup">Add New Course</button>
        </div>

        <table class="courses-table">
            <thead>
                <tr>
                    <th>Course Code</th>
                    <th>Course Title</th>
                    <th>Credit Load</th>
                </tr>
            </thead>
            <tbody id="coursesTableBody">
                <!-- Course rows will be dynamically added here -->
            </tbody>
        </table>
    </div>

    <div id="popup">
        <div class="popup-content">
            <div class="pop-head">
            <h2>New Course</h2>    
            <span class="close-btn" id="closePopup">&times;</span>
            </div>

            <form id="courseForm">
                <input type="text" id="courseCode" placeholder="Course Code" required>
                <input type="text" id="courseTitle" placeholder="Course Title" required>
                <input type="number" id="creditLoad" placeholder="Credit Load" required>
                <button type="submit" class="btn btn-primary">Add Course</button>
            </form>
        </div>
    </div>

    <script>
        const popup = document.getElementById('popup');
        const openBtn = document.getElementById('openPopup');
        const closeBtn = document.getElementById('closePopup');

        openBtn.addEventListener('click', () => {
            popup.style.display = 'flex';
        });

        closeBtn.addEventListener('click', () => {
            popup.style.display = 'none';
        });
    </script>
</body>
</html>
