<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="container">
        <div class="sidebar">
    <div class="logo">
      <i class="fas fa-graduation-cap"></i>
      ADMIN
    </div>

    <div class="nav-item active" onclick="switchSection('dashboard', this)">
      <i class="fas fa-chart-pie"></i> <a href="">Dashboard</a>
    </div>

    <div class="nav-item" onclick="switchSection('courses', this)">
      <i class="fas fa-book"></i> <a href="courses.html"> Courses</a>
    </div>

  </div>
  <!-- MAIN -->
  <div class="main-content">

    <!-- HEADER -->
    <div class="header">
      <h2 id="pageTitle"></h2>

      <div class="user-profile">
        <div class="user-avatar"><i class="fas fa-user"></i></div>
        <span>Admin</span>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="section active">

        <div class="table-header">
            <h2>Dashboard</h2>
        </div>
        <div class="dashboard-cards">

        <div class="card">
          <div class="card-title">Total Courses</div>
          <div class="card-value" id="totalCourses">0</div>
        </div>

        <div class="card">
          <div class="card-title">Active Courses</div>
          <div class="card-value" id="activeCount">0</div>
        </div>

      </div>
    </div>
    </div>
</body>
</html>
