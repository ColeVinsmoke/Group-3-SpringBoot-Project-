<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <!-- FONT AWESOME -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="logo">
            <i class="fas fa-graduation-cap"></i>
            ADMIN
        </div>

        <!-- DASHBOARD LINK -->
        <div class="nav-item active">
            <i class="fas fa-chart-pie"></i>
            <a th:href="@{/adminDashboard}">Dashboard</a>
        </div>

        <!-- COURSES LINK -->
        <div class="nav-item">
            <i class="fas fa-book"></i>
            <a th:href="@{/courses}">Courses</a>
        </div>

        <!-- LOGOUT LINK -->
        <div class="nav-item">
            <i class="fas fa-sign-out-alt"></i>
            <a th:href="@{/logout}">Logout</a>
        </div>

    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <!-- HEADER -->
        <div class="header">

            <h2>Admin Dashboard</h2>

            <div class="user-profile">

                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>

                <!-- DISPLAY ADMIN NAME -->
                <span th:text="${adminName}">Admin</span>

            </div>

        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboard" class="section active">

            <div class="table-header">
                <h2>Dashboard</h2>
            </div>

            <!-- CARDS -->
            <div class="dashboard-cards">

                <!-- TOTAL COURSES -->
                <div class="card">

                    <div class="card-title">
                        Total Courses
                    </div>

                    <div class="card-value"  id="totalCourses"
                         th:text="${totalCourses}">
                        0
                    </div>

                </div>

                <!-- ACTIVE COURSES -->
                <div class="card">

                    <div class="card-title">
                        Active Courses
                    </div>

                    <div class="card-value" id="activeCount"
                         th:text="${activeCourses}">
                        0
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
