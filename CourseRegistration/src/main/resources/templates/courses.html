<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="logo">
      <i class="fas fa-graduation-cap"></i>
      ADMIN
    </div>

    <!-- DASHBOARD -->
    <div class="nav-item">
      <i class="fas fa-chart-pie"></i>

      <a th:href="@{/adminDashboard}">
        Dashboard
      </a>
    </div>

    <!-- COURSES -->
    <div class="nav-item active">
      <i class="fas fa-book"></i>

      <a th:href="@{/courses}">
        Courses
      </a>
    </div>

    <!-- LOGOUT -->
    <div class="nav-item">
      <i class="fas fa-sign-out-alt"></i>

      <a th:href="@{/logout}">
        Logout
      </a>
    </div>

  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <!-- HEADER -->
    <div class="header">

      <h2>Courses</h2>

      <div class="user-profile">

        <div class="user-avatar">
          <i class="fas fa-user"></i>
        </div>

        <!-- DYNAMIC ADMIN NAME -->
        <span th:text="${adminName}">Admin</span>

      </div>

    </div>

    <!-- COURSES SECTION -->
    <div id="courses" class="section active">

      <div class="table-header">

        <h2>Available Courses</h2>

        <button class="btn btn-primary" id="openPopup">
          Add New Course
        </button>

      </div>

      <!-- COURSES TABLE -->
      <table class="courses-table">

        <thead>
        <tr>
          <th>Course Code</th>
          <th>Course Title</th>
          <th>Credit Load</th>
        </tr>
        </thead>

        <tbody>

        <!-- THYMELEAF LOOP -->
        <tr th:each="course : ${courses}">

          <td th:text="${course.code}">CSC101</td>
          <td th:text="${course.title}">
            Introduction to Programming
          </td>
          <td th:text="${course.creditUnits}">3</td>

          <!-- DELETE BUTTON -->
          <td>
            <a th:href="@{'/courses/delete/' + ${course.id}}"
               onclick="return confirm('Are you sure you want to delete this course?')"
               class="delete-btn">

              <i class="fas fa-minus-circle" style="color:red; font-size:18px;"></i>

            </a>
          </td>

        </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>

<!-- POPUP -->
<div id="popup">

  <div class="popup-content">

    <div class="pop-head">

      <h2>New Course</h2>

      <span class="close-btn" id="closePopup">
                &times;
            </span>

    </div>

    <!-- THYMELEAF FORM -->
    <form th:action="@{/courses/add}" method="post">

      <input type="text"
             name="code"
             placeholder="Course Code"
             required>

      <input type="text"
             name="title"
             placeholder="Course Title"
             required>

      <input type="number"
             name="creditUnits"
             placeholder="Credit Load"
             required>

      <button type="submit" class="btn btn-primary">
        Add Course
      </button>

    </form>

  </div>

</div>

<!-- JAVASCRIPT -->
<script>

  const popup = document.getElementById('popup');
  const openBtn = document.getElementById('openPopup');
  const closeBtn = document.getElementById('closePopup');

  openBtn.addEventListener('click', () => {
      popup.style.display = 'flex';
  });

  closeBtn.addEventListener('click', () => {
      popup.style.display = 'none';
  });

</script>

</body>
</html>
