<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Course Dashboard</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="logo">
      <i class="fas fa-graduation-cap"></i>
      Course MS
    </div>

    <!-- DASHBOARD -->
    <div class="nav-item active"
         onclick="switchSection('dashboard', this)">

      <i class="fas fa-chart-pie"></i>
      Dashboard

    </div>

    <!-- COURSES -->
    <div class="nav-item"
         onclick="switchSection('courses', this)">

      <i class="fas fa-book"></i>
      Courses

    </div>

    <!-- MY COURSES -->
    <div class="nav-item"
         onclick="switchSection('mycourses', this)">

      <i class="fas fa-graduation-cap"></i>
      My Courses

    </div>

    <!-- LOGOUT -->
    <div class="nav-item">
      <i class="fas fa-sign-out-alt"></i>

      <a th:href="@{/logout}">
        Logout
      </a>
    </div>

  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <!-- HEADER -->
    <div class="header">

      <h2>Student Dashboard</h2>

      <div class="user-profile">

        <div class="user-avatar">
          <i class="fas fa-user"></i>
        </div>

        <span th:text="${username}">
          User
        </span>

      </div>

    </div>

    <!-- FLASH MESSAGE -->
    <div th:if="${success != null or error != null}"
         id="flashMessage"
         class="alert"
         th:classappend="${success} ? 'success' : 'error'">

      <span th:text="${success != null ? success : error}"></span>

    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard" class="section active">

      <div class="table-header">
        <h2>Dashboard Overview</h2>
      </div>

      <div class="dashboard-cards">

        <!-- TOTAL CREDITS -->
        <div class="card">

          <div class="card-title">
            Total Credits
          </div>

          <div class="card-value"
               th:text="${totalCredits}">
            0
          </div>

        </div>

        <!-- ENROLLED COURSES -->
        <div class="card">

          <div class="card-title">
            Enrolled Courses
          </div>

          <div class="card-value"
               th:text="${courseCount}">
            0
          </div>

        </div>

        <!-- CREDIT STATUS -->
        <div class="card">

          <div class="card-title">
            Credit Status
          </div>

          <div class="status-badge"
               th:text="${creditStatus}">
            OK
          </div>

        </div>

      </div>

    </div>

    <!-- AVAILABLE COURSES -->
    <div id="courses" class="section">

      <div class="table-header">

        <h2>Available Courses</h2>

        <!-- SEARCH -->
        <input type="text"
               id="searchInput"
               placeholder="Search by code or title..."
               class="search-input">

      </div>

      <table>

        <thead>

        <tr>
          <th>Course Code</th>
          <th>Course Title</th>
          <th>Credit Units</th>
          <th>Action</th>
        </tr>
        </thead>

        <tbody>

        <!-- LOOP ALL COURSES -->
        <tr th:each="course : ${courses}"
            class="course-row">

          <td class="code"
              th:text="${course.code}">
          </td>

          <td class="title"
              th:text="${course.title}">
          </td>

          <td th:text="${course.creditUnits}">
          </td>

          <!-- ENROLL BUTTON -->
          <td>

            <form th:action="@{'/register/' + ${course.id}}"
                  method="get">

              <button type="submit"
                      class="btn btn-primary">
                Enroll
              </button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <!-- MY COURSES -->
    <div id="mycourses" class="section">

      <div class="table-header">
        <h2>My Courses</h2>
      </div>

      <table>

        <thead>

        <tr>
          <th>Course Code</th>
          <th>Course Title</th>
          <th>Credit Units</th>
          <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <!-- LOOP REGISTERED COURSES -->
        <tr th:each="course : ${myCourses}">

          <td th:text="${course.code}"></td>

          <td th:text="${course.title}"></td>

          <td th:text="${course.creditUnits}"></td>

          <!-- DROP BUTTON -->
          <td>

            <form th:action="@{'/drop/' + ${course.id}}"
                  method="get">

              <button type="submit"
                      class="btn btn-danger">

                Drop

              </button>

            </form>

          </td>

        </tr>

        </tbody>

      </table>

      <!-- TOTAL CREDITS -->
      <div class="card">

        <strong>Total Credits:</strong>

        <span th:text="${totalCredits}">
          0
        </span>

      </div>

    </div>

  </div>

</div>

<script>

  function switchSection(sectionId, element = null) {

      // HIDE ALL SECTIONS
      document.querySelectorAll('.section')
          .forEach(section => {
              section.classList.remove('active');
          });

      // REMOVE ACTIVE NAV ITEM
      document.querySelectorAll('.nav-item')
          .forEach(item => {
              item.classList.remove('active');
          });

      // SHOW CURRENT SECTION
      document.getElementById(sectionId)
          .classList.add('active');

      // ACTIVATE SIDEBAR ITEM
      if (element) {
          element.classList.add('active');
      }
  }

  // KEEP ACTIVE SECTION AFTER REDIRECT
  window.onload = function () {

      const hash = window.location.hash.substring(1);

      if (hash) {

          const section = document.getElementById(hash);

          if (section) {

              // HIDE ALL
              document.querySelectorAll('.section')
                  .forEach(s => {
                      s.classList.remove('active');
                  });

              // SHOW TARGET SECTION
              section.classList.add('active');
          }
      }
  }

  // COURSE SEARCH
  const searchInput = document.getElementById("searchInput");

  const rows = document.querySelectorAll(".course-row");

  searchInput.addEventListener("keyup", function () {

      const value = this.value.toLowerCase();

      rows.forEach(row => {

          const code =
              row.querySelector(".code")
              .textContent
              .toLowerCase();

          const title =
              row.querySelector(".title")
              .textContent
              .toLowerCase();

          if (code.includes(value) || title.includes(value)) {

              row.style.display = "";

          } else {

              row.style.display = "none";
          }

      });

  });

  // AUTO HIDE FLASH MESSAGE
setTimeout(() => {
    const msg = document.getElementById("flashMessage");
    if (msg) {
        msg.style.transition = "0.5s";
        msg.style.opacity = "0";
        setTimeout(() => msg.remove(), 500);
    }
}, 3000);

</script>

</body>
</html>
